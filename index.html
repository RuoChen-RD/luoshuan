<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>螺栓已拧 ROI 检测</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>螺栓已拧 ROI 检测</h1>
          <p>固定坐标逐点检测，只把黑色螺栓头作为已拧上的依据。</p>
        </div>
        <div class="actions">
          <input id="imageInput" type="file" accept="image/*" hidden />
          <input id="layoutInput" type="file" accept="application/json,.json" hidden />
          <button id="loadImageBtn" type="button">导入图片</button>
          <button id="runBtn" type="button">重新检测</button>
          <button id="resetLayoutBtn" type="button">恢复默认</button>
          <button id="snapLayoutBtn" type="button">按当前图校准点位</button>
          <button id="openLayoutBtn" type="button">打开点位文件</button>
          <button id="saveLayoutFileBtn" type="button">保存点位文件</button>
          <button id="exportResultBtn" type="button">导出结果</button>
        </div>
      </header>
      <div id="statusText" class="status-line">正在加载样图...</div>

      <section class="workspace">
        <div class="viewer-panel">
          <div class="viewer-toolbar">
            <label class="toggle">
              <input id="editMode" type="checkbox" />
              <span>编辑点位</span>
            </label>
            <label class="toggle" hidden>
              <input id="calibrationMode" type="checkbox" />
              <span>标定基准点</span>
            </label>
            <label class="toggle" hidden>
              <input id="autoLocateOnLoad" type="checkbox" />
              <span>导入后自动定位</span>
            </label>
            <button id="autoLocateBtn" type="button" hidden>自动定位</button>
            <button id="resetCalibrationBtn" type="button" hidden>重置标定</button>
            <label>
              X 偏移
              <input id="offsetX" type="number" value="0" step="1" />
            </label>
            <label>
              Y 偏移
              <input id="offsetY" type="number" value="0" step="1" />
            </label>
            <label>
              ROI 半径
              <input id="radiusInput" type="number" value="28" step="1" min="8" />
            </label>
          </div>
          <div class="canvas-wrap">
            <canvas id="imageCanvas"></canvas>
          </div>
        </div>

        <aside class="side-panel">
          <section class="panel-section">
            <h2>当前点位</h2>
            <div id="selectedFields" class="field-grid">
              <label>
                编号
                <input id="pointId" type="text" />
              </label>
              <label>
                类型
                <select id="pointType">
                  <option value="bolt">检测点位</option>
                  <option value="ignore">忽略</option>
                </select>
              </label>
              <label>
                X
                <input id="pointX" type="number" step="1" />
              </label>
              <label>
                Y
                <input id="pointY" type="number" step="1" />
              </label>
              <label>
                半径
                <input id="pointR" type="number" step="1" min="8" />
              </label>
              <label>
                检测目标
                <select id="expectedColor">
                  <option value="blackHead">黑色螺栓头</option>
                  <option value="darkHead">深色螺栓头</option>
                </select>
              </label>
            </div>
            <div class="row-actions">
              <button id="applyPointBtn" type="button">应用修改</button>
              <button id="addPointBtn" type="button">新增点位</button>
              <button id="deletePointBtn" type="button">删除点位</button>
            </div>
          </section>

          <section class="panel-section">
            <h2>检测阈值</h2>
            <div class="field-grid">
              <label>
                最小黑色占比
                <input id="minPresence" type="number" value="0.12" step="0.01" min="0" max="1" />
              </label>
              <label>
                最大黑色占比
                <input id="maxPresence" type="number" value="0.82" step="0.01" min="0" max="1" />
              </label>
              <label>
                最小深黑占比
                <input id="minSolidHead" type="number" value="0.16" step="0.005" min="0" max="1" />
              </label>
              <label>
                最大偏心
                <input id="maxOffsetRatio" type="number" value="0.58" step="0.01" min="0" max="1" />
              </label>
              <label>
                弱信号范围
                <input id="maxShadowImbalance" type="number" value="1.35" step="0.05" min="1" />
              </label>
            </div>
          </section>

          <section class="panel-section summary">
            <h2>汇总</h2>
            <div class="summary-grid">
              <span>已拧</span><strong id="okCount">0</strong>
              <span>复核</span><strong id="reviewCount">0</strong>
              <span>未拧</span><strong id="ngCount">0</strong>
              <span>忽略</span><strong id="ignoreCount">0</strong>
            </div>
          </section>
        </aside>
      </section>

      <section class="results">
        <div class="table-head">
          <h2>检测明细</h2>
          <span id="imageInfo"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>点位</th>
                <th>类型</th>
                <th>结果</th>
                <th>黑色占比</th>
                <th>深黑占比</th>
                <th>垫片占比</th>
                <th>偏心</th>
                <th>强度</th>
                <th>说明</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
